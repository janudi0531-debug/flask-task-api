version: '3.8'

services:
  app-prod:
    image: flask-task-api:latest
    container_name: flask-prod
    ports:
      - '5000:5000'
    environment:
      - FLASK_ENV=production
    networks:
      - devops-net
    restart: unless-stopped

  prometheus:
    build:
      context: .
      dockerfile: prometheus.Dockerfile
    container_name: prometheus
    ports:
      - '9090:9090'
    networks:
      - devops-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - devops-net
    restart: unless-stopped

volumes:
  grafana_data:

networks:
  devops-net:
    external: true